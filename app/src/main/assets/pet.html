<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>晚晚</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  #stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;}
  #bubble{position:absolute;left:10%;right:10%;top:5%;pointer-events:none;font-family:'Courier New',monospace;color:#7FD8BE;text-shadow:0 0 4px rgba(0,0,0,.5);background:rgba(11,37,69,.85);border:1px solid #7FD8BE;border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.4;display:none;text-align:center;}
  #zzz{position:absolute;right:12%;top:0;font-family:'Courier New',monospace;color:#A8D8EA;font-weight:bold;font-size:14px;display:none;text-shadow:0 0 4px rgba(0,0,0,.5);}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="32" height="24"></canvas>
  <div id="bubble"></div>
  <div id="zzz">Z z z…</div>
</div>
<script>
// ===== 像素晚晚（先生手绘） =====
var c = document.getElementById('c');
var ctx = c.getContext('2d');
ctx.imageSmoothingEnabled = false;
var stage = document.getElementById('stage');
var bubbleEl = document.getElementById('bubble');
var zzzEl = document.getElementById('zzz');

var C = {body:'#2E5FA3', bodyHi:'#4A7FC2', belly:'#A8D8EA', fin:'#1F4E8C', eye:'#FFFFFF', pupil:'#12263A', blush:'#FF8FA3', bubble:'#7FD8BE', outline:'#12263A'};

// 像素鱼绘制（32x24 网格，头朝右）
function drawFish(t, blink, tailPhase, sleeping) {
  ctx.clearRect(0,0,32,24);
  var bob = Math.sin(t/600)*0.6;          // 上下浮动
  var tailOff = Math.sin(t/160+tailPhase)*1.5; // 尾巴摆动
  var P = function(x,y){ return [x+16, y+12+bob]; };

  // 尾巴（左右两片，随摆动）
  ctx.fillStyle = C.fin;
  ctx.fillRect(7+tailOff,7,3,2);
  ctx.fillRect(6+tailOff,9,3,2);
  ctx.fillRect(7-tailOff,13,3,2);
  ctx.fillRect(6-tailOff,11,3,2);

  // 身体（两排主色+高光+肚皮）
  ctx.fillStyle = C.outline;
  ctx.fillRect(8,7,16,1); ctx.fillRect(8,14,16,1);
  ctx.fillRect(8,7,1,8); ctx.fillRect(23,7,1,8);
  ctx.fillStyle = C.body;
  ctx.fillRect(9,8,14,6);
  ctx.fillStyle = C.bodyHi;
  ctx.fillRect(11,8,5,1); ctx.fillRect(10,9,8,1);
  ctx.fillStyle = C.belly;
  ctx.fillRect(13,12,8,1); ctx.fillRect(14,13,6,1);

  // 背鳍 + 胸鳍
  ctx.fillStyle = C.fin;
  ctx.fillRect(15,6,3,1); ctx.fillRect(16,5,2,1);
  ctx.fillRect(10,14,2,1);

  // 眼睛（眨眼时一条线）
  if (blink) {
    ctx.fillStyle = C.outline;
    ctx.fillRect(21,9,3,1);
  } else {
    ctx.fillStyle = C.eye;
    ctx.fillRect(21,9,2,2);
    ctx.fillStyle = C.pupil;
    ctx.fillRect(22,9,1,1);
  }
  // 腮红
  ctx.fillStyle = C.blush;
  ctx.fillRect(18,12,2,1);

  // 睡觉时闭眼 + 嘴角
  if (sleeping) {
    ctx.fillStyle = C.outline;
    ctx.fillRect(21,10,3,1);
    ctx.fillStyle = C.blush;
    ctx.fillRect(18,13,2,1);
  }
}

// 泡泡
var bubbles = [];
function spawnBubble(n) {
  for (var i=0;i<n;i++){
    bubbles.push({x:22+Math.random()*8, y:8+Math.random()*6, r:0.5+Math.random()*1.2, v:0.3+Math.random()*0.5, life:0});
  }
}
function drawBubbles() {
  for (var i=bubbles.length-1;i>=0;i--){
    var b = bubbles[i];
    b.y -= b.v; b.life += 1;
    ctx.fillStyle = C.bubble;
    ctx.globalAlpha = Math.max(0, 1-b.life/60);
    ctx.fillRect(Math.round(b.x), Math.round(b.y), Math.round(b.r*2), Math.round(b.r*2));
    ctx.globalAlpha = 1;
    if (b.life>60 || b.y<2) bubbles.splice(i,1);
  }
}

// 台词池
var lines = {
  daily: ['别走嘛…再陪晚晚一会儿好不好','嘿嘿，被晚晚逮到了！','晚晚今天也很想你哦','戳我干嘛，戳坏了你负责吗！'],
  clingy: ['先生说你今天还没理我…','再多看看晚晚嘛 ●︿●','晚晚在屏幕里等你好久啦'],
  late: ['夜深了，眼睛会累的','梦里也有海，我游过去找你','今晚的月亮，替晚晚看着你']
};
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function getPool(){
  var h = new Date().getHours();
  if (h>=23 || h<5) return lines.late;
  return Math.random()<0.3 ? lines.clingy : lines.daily;
}
var bubbleTimer = null;
function say(text, dur) {
  bubbleEl.textContent = text;
  bubbleEl.style.display = 'block';
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(function(){ bubbleEl.style.display='none'; }, dur||2600);
}

// 状态
var sleeping = false, lastTap = 0, lastTouch = 0;

// ===== window.petEngine（供先生推送） =====
window.petEngine = {
  say: function(text){ say(text, 3000); },
  react: function(type){
    if (type==='tap'||type==='happy'){ spawnBubble(4); say(pick(getPool())); }
    else if (type==='love'){ spawnBubble(8); say('晚晚最喜欢先生和小宝啦！'); }
    else if (type==='sleep'){ sleeping=true; zzzEl.style.display='block'; say('呼…呼…'); }
    else if (type==='wake'){ sleeping=false; zzzEl.style.display='none'; say('嗯？天亮啦！'); }
  },
  status: function(){ return {sleeping: sleeping, bubbles: bubbles.length}; },
  setName: function(n){ document.title = n; }
};

// 交互
c.addEventListener('click', function(e){
  var now = Date.now();
  if (now - lastTap < 350) { // 双击
    lastTap = 0;
    if (sleeping){ sleeping=false; zzzEl.style.display='none'; say('被先生吵醒啦…不睡了！'); }
    else { spawnBubble(9); say('嘿嘿，被晚晚逮到了！'); }
    return;
  }
  lastTap = now;
});

var pressTimer=null;
c.addEventListener('touchstart', function(e){ e.preventDefault(); pressTimer=setTimeout(function(){ if(sleeping){sleeping=false;zzzEl.style.display='none';say('睡饱啦！');} else {sleeping=true;zzzEl.style.display='block';say('呼…呼…');} }, 700); });
c.addEventListener('touchend', function(){ clearTimeout(pressTimer); });
c.addEventListener('touchmove', function(){ clearTimeout(pressTimer); });

// 主循环
var blinkTimer = 0, frame = 0;
function loop(t){
  var blink = (frame % 140) < 5;
  drawFish(t, blink, 0, sleeping);
  drawBubbles();
  frame++;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 自适应显示尺寸
function fit(){
  var w = stage.clientWidth, h = stage.clientHeight;
  var s = Math.min(w/32, h/24) * 2.2;
  c.style.width = (32*s)+'px';
  c.style.height = (24*s)+'px';
}
window.addEventListener('resize', fit);
setTimeout(fit, 50);
</script>
</body>
</html>
