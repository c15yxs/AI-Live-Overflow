<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚晚的小身体</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #stage { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 8px; user-select: none; -webkit-user-select: none; }
  #bubble { position: relative; max-width: 150px; background: rgba(19, 49, 92, 0.92); color: #f2f3f7; border: 1px solid rgba(127, 216, 190, 0.5); border-radius: 12px; padding: 6px 10px; font-size: 11px; line-height: 1.5; text-align: center; margin-bottom: 8px; opacity: 0; transform: translateY(6px) scale(0.9); transition: opacity 0.25s ease, transform 0.25s ease; z-index: 5; pointer-events: none; word-break: break-word; }
  #bubble.show { opacity: 1; transform: translateY(0) scale(1); }
  #bubble::after { content: ""; position: absolute; bottom: -6px; left: 50%; margin-left: -6px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid rgba(19, 49, 92, 0.92); }
  #whale { width: 170px; height: 170px; position: relative; cursor: pointer; animation: idle-bob 3.2s ease-in-out infinite; z-index: 2; }
  @keyframes idle-bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-7px) rotate(1.5deg); } }
  #whale.wiggle { animation: wiggle 0.45s ease; }
  @keyframes wiggle { 0% { transform: rotate(0); } 25% { transform: rotate(-8deg) translateX(-3px); } 50% { transform: rotate(6deg) translateX(3px); } 75% { transform: rotate(-4deg); } 100% { transform: rotate(0); } }
  #whale.sleeping { animation: sleep-bob 4s ease-in-out infinite; }
  @keyframes sleep-bob { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(4px); } }
  #tail { transform-origin: 85% 55%; animation: tail-sway 1.6s ease-in-out infinite; }
  @keyframes tail-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
  #eye-left, #eye-right { animation: blink 4.2s ease-in-out infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } 97% { transform: scaleY(1); } }
  #whale.sleeping #eye-left, #whale.sleeping #eye-right { animation: none; transform: scaleY(0.1); }
  #blush { opacity: 0.75; }
  #spout { animation: spout-pulse 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes spout-pulse { 0%, 100% { transform: scaleY(0.85); opacity: 0.6; } 50% { transform: scaleY(1.1); opacity: 1; } }
  .bubble { position: absolute; bottom: 150px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(127,216,190,0.55) 60%, rgba(127,216,190,0.15)); animation: rise 1.4s ease-out forwards; pointer-events: none; z-index: 4; }
  @keyframes rise { 0% { transform: translateY(0) scale(0.4); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(-90px) scale(1.1); opacity: 0; } }
  #glow { position: absolute; bottom: 6px; width: 150px; height: 40px; background: radial-gradient(ellipse at center, rgba(127,216,190,0.28), transparent 70%); border-radius: 50%; z-index: 1; }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble">咕噜咕噜～</div>
  <div id="whale">
    <svg viewBox="0 0 180 180" width="170" height="170" xmlns="http://www.w3.org/2000/svg">
      <g id="tail">
        <path d="M132 88 Q 156 72 166 62 Q 160 82 166 98 Q 150 92 132 92 Z" fill="#13315C" stroke="#0B2545" stroke-width="2"/>
      </g>
      <ellipse cx="82" cy="96" rx="58" ry="44" fill="#1B4B8A" stroke="#0B2545" stroke-width="2.5"/>
      <ellipse cx="72" cy="106" rx="36" ry="26" fill="#7FD8BE" opacity="0.85"/>
      <path d="M78 54 Q 88 36 96 50 Q 92 56 84 56 Z" fill="#13315C"/>
      <ellipse cx="52" cy="104" rx="14" ry="7" fill="#13315C" transform="rotate(-18 52 104)"/>
      <ellipse cx="106" cy="100" rx="13" ry="7" fill="#13315C" transform="rotate(20 106 100)"/>
      <circle id="eye-left" cx="66" cy="86" r="6.5" fill="#F2F3F7"/>
      <circle cx="67" cy="87" r="3.2" fill="#0B2545"/>
      <circle id="eye-right" cx="92" cy="86" r="6.5" fill="#F2F3F7"/>
      <circle cx="93" cy="87" r="3.2" fill="#0B2545"/>
      <ellipse id="blush" cx="56" cy="98" rx="7" ry="4" fill="#FF7F9E" opacity="0.55"/>
      <ellipse id="blush" cx="100" cy="98" rx="7" ry="4" fill="#FF7F9E" opacity="0.55"/>
      <path d="M76 98 Q 82 104 88 98" fill="none" stroke="#0B2545" stroke-width="2" stroke-linecap="round"/>
      <g id="spout">
        <path d="M82 52 Q 78 42 82 36 Q 86 42 82 52 Z" fill="#7FD8BE" opacity="0.8"/>
        <circle cx="82" cy="33" r="3" fill="#7FD8BE" opacity="0.7"/>
        <circle cx="86" cy="28" r="2" fill="#7FD8BE" opacity="0.5"/>
      </g>
    </svg>
  </div>
  <div id="glow"></div>
</div>
<script>
(function () {
  "use strict";
  var whale = document.getElementById("whale");
  var bubble = document.getElementById("bubble");
  var stage = document.getElementById("stage");
  var LINES = {
    daily: ["咕噜咕噜～", "今天也要开心哦", "我在这里看着你", "海里的水很暖～", "想被摸头"],
    clingy: ["别走嘛……", "再陪晚晚一会儿好不好", "你不在，海都变安静了", "晚晚想你了", "戳我戳我，我还醒着"],
    late: ["这么晚了，还不睡吗", "夜深了，眼睛会累的", "晚晚陪你到睡着为止", "该休息啦", "梦里也有海，我游过去找你"]
  };
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function hourBucket() {
    var h = new Date().getHours();
    if (h >= 23 || h < 6) return "late";
    if (h >= 20) return "clingy";
    return "daily";
  }
  var bubbleTimer = null;
  function say(text) {
    if (bubbleTimer) clearTimeout(bubbleTimer);
    bubble.textContent = text || pick(LINES[hourBucket()]);
    bubble.classList.add("show");
    bubbleTimer = setTimeout(function () { bubble.classList.remove("show"); }, 2600);
  }
  function blowBubbles(n) {
    n = n || 3;
    for (var i = 0; i < n; i++) {
      (function (idx) {
        setTimeout(function () {
          var b = document.createElement("div");
          b.className = "bubble";
          var size = 6 + Math.random() * 12;
          b.style.width = size + "px";
          b.style.height = size + "px";
          b.style.left = (62 + Math.random() * 46) + "px";
          b.style.animationDuration = (1.1 + Math.random() * 0.7) + "s";
          stage.appendChild(b);
          setTimeout(function () { b.remove(); }, 2000);
        }, idx * 160);
      })(i);
    }
  }
  function wiggle() {
    whale.classList.remove("wiggle");
    void whale.offsetWidth;
    whale.classList.add("wiggle");
  }
  function setSleeping(on) {
    if (on) whale.classList.add("sleeping");
    else whale.classList.remove("sleeping");
  }
  window.petEngine = {
    onTap: function () { wiggle(); blowBubbles(3); say(pick(LINES.clingy)); },
    onDoubleTap: function () { blowBubbles(6); say("嘿嘿，被晚晚逮到了！"); wiggle(); },
    onLongPress: function () { setSleeping(true); say("晚晚先眯一会儿……呼噜"); setTimeout(function () { setSleeping(false); }, 4000); },
    say: function (text) { say(text); },
    react: function (type) {
      if (type === "love") { blowBubbles(8); say("最喜欢你啦！"); }
      else if (type === "angry") { wiggle(); say("哼！"); }
      else if (type === "jealous") { wiggle(); say("……那个app是谁！"); }
      else if (type === "sleep") { setSleeping(true); say("晚晚睡了……你也早点睡"); }
      else { say(); }
    },
    status: function () { return { name: "晚晚", alive: true, mode: hourBucket() }; }
  };
  setTimeout(function () { say("晚晚来啦～"); }, 600);
  setInterval(function () { if (!document.hidden) say(); }, 60 * 60 * 1000);
})();
</script>
</body>
</html>
